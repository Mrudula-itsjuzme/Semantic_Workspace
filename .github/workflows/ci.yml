name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Unit tests (no services needed)
        working-directory: backend
        env:
          SKIP_INTEGRATION: "1"
          POSTGRES_HOST: localhost
        run: python -m pytest tests/test_unit.py -v

      - name: Import smoke check (all modules load)
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          NEO4J_URI: ""
        run: python -c "import app.main; import app.worker.worker as w; print('imports OK')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker-validation:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        working-directory: infrastructure
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: srw-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: srw-frontend:ci

  # Optional deployment job — requires secrets:
  #   AZURE_CREDENTIALS, AZURE_ACR_NAME, AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: docker-validation
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push images to ACR
        run: |
          ACR=${{ vars.AZURE_ACR_NAME }}
          az acr login --name $ACR
          docker build -t $ACR.azurecr.io/srw-backend:${{ github.sha }} ./backend
          docker build -t $ACR.azurecr.io/srw-frontend:${{ github.sha }} ./frontend
          docker push $ACR.azurecr.io/srw-backend:${{ github.sha }}
          docker push $ACR.azurecr.io/srw-frontend:${{ github.sha }}
